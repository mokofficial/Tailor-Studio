<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A3A">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailor Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --bg:#E7E1D3; --surface:#FBF9F3; --ink:#26221B; --ink-soft:#645E50;
    --primary:#1E3A3A; --primary-dark:#122626; --gold:#B8842E; --gold-soft:#E7D2A4;
    --rust:#A2432B; --rust-soft:#F0DAD1; --line:#D6CDB6; --green:#3E6B4F; --green-soft:#DCE9DD;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  body{font-family:'Work Sans',sans-serif;color:var(--ink);}
  .disp{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  ::selection{background:var(--gold-soft);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{
    font-family:inherit;background:var(--surface);border:1px solid var(--line);
    border-radius:6px;padding:8px 10px;color:var(--ink);font-size:13.5px;width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  label{font-size:12px;color:var(--ink-soft);font-weight:500;display:block;margin-bottom:4px;}
  a{color:inherit;text-decoration:none;}

  .shell{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;overflow:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .brand-badge{width:42px;height:42px;border-radius:12px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;
    font-size:16px;flex-shrink:0;overflow:hidden;}
  .brand-badge img{width:100%;height:100%;object-fit:cover;}
  .brand-text{min-width:0;}
  .brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:17px;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
  .brand-greet{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}

  .content{flex:1;min-height:0;overflow-y:auto;padding:20px;}
  .bottomnav{display:flex;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));position:relative;z-index:5;}
  .navtab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;
    border-radius:12px;color:var(--ink-soft);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;}
  .navtab svg{width:21px;height:21px;}
  .navtab .navlabel{font-size:10px;font-weight:500;}
  .navtab.active{color:var(--primary);}
  .navtab.active svg{color:var(--gold);}
  .navtab:hover{background:rgba(38,34,27,0.04);}

  .btn{border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:8px;
    padding:9px 14px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--primary-dark);}
  .btn.ghost{background:transparent;color:var(--primary);}
  .btn.ghost:hover{background:rgba(30,58,58,0.08);}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;}
  .btn.gold:hover{background:#a1751f;}
  .btn.rust{background:var(--rust);border-color:var(--rust);color:#fff;}
  .btn.wa{background:#3fa858;border-color:#3fa858;color:#fff;}
  .btn.wa:hover{background:#358f4a;}
  .btn.sm{padding:6px 10px;font-size:12.5px;}
  .btn svg{width:14px;height:14px;flex-shrink:0;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:8px;
    width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .iconbtn:hover{background:rgba(38,34,27,0.05);}
  .iconbtn svg{width:15px;height:15px;}

  .switch{position:relative;display:inline-block;width:40px;height:23px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;inset:0;background:var(--line);border-radius:23px;transition:background .15s;cursor:pointer;}
  .switch .slider::before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch input:checked + .slider{background:var(--primary);}
  .switch input:checked + .slider::before{transform:translateX(17px);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;
    box-shadow:0 1px 2px rgba(38,34,27,0.05), 0 6px 16px rgba(38,34,27,0.05);}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .icon-badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-badge svg{width:16px;height:16px;}

  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:18px;}
  .grid-2-even{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .grid-form2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid-meas{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
  .grid-stats>.card,.grid-2>.card,.grid-2-even>.card,.grid-cards>.card{min-width:0;}
  canvas{max-width:100%;}
  @media (max-width:760px){ .grid-2{grid-template-columns:1fr;} .grid-2-even{grid-template-columns:1fr;} }

  .chipbar{display:flex;flex-wrap:wrap;gap:6px;}
  .tape-track{position:relative;height:16px;border-radius:3px;
    background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px 8px),
      repeating-linear-gradient(to right,var(--line) 0 1.5px,transparent 1.5px 40px);
    background-color:var(--surface);border:1px solid var(--line);overflow:hidden;}
  .tape-track .fill{position:absolute;top:0;left:0;height:100%;background:var(--primary);transition:width .4s ease;}
  .tape-track.cancelled .fill{background:var(--ink-soft);}
  .tape-labels{display:flex;justify-content:space-between;margin-top:4px;font-size:9.5px;color:var(--ink-soft);flex-wrap:wrap;}
  .divider{height:10px;margin:10px 0 16px;
    background-image:repeating-linear-gradient(to right,var(--gold) 0 2px,transparent 2px 12px);opacity:.55;}

  .thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
  .thumbwrap{position:relative;}
  .thumb-x{position:absolute;top:-6px;right:-6px;background:var(--rust);color:#fff;border:none;
    border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .addthumb{width:64px;height:64px;flex-direction:column;padding:0;border-style:dashed;}
  .addthumb svg{width:15px;height:15px;}

  .modalwrap{position:fixed;inset:0;background:rgba(20,20,15,0.55);display:flex;align-items:flex-start;
    justify-content:center;z-index:50;padding:30px 16px;overflow-y:auto;}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;padding:22px;margin-bottom:30px;}
  .modal.wide{max-width:760px;}
  .modal.full{max-width:960px;width:96vw;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0;}

  .logo-upload{width:88px;height:88px;border-radius:16px;border:1.5px dashed var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink-soft);flex-shrink:0;}
  .logo-upload img{width:100%;height:100%;object-fit:cover;}

  .theme-swatch{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:transparent;padding:8px 4px;border-radius:10px;width:100%;box-sizing:border-box;}
  .theme-swatch:hover{background:rgba(38,34,27,0.05);}
  .swatch-circle{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);}
  .theme-swatch.active .swatch-circle{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);}
  .swatch-label{font-size:10.5px;color:var(--ink-soft);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .theme-swatch.active .swatch-label{color:var(--ink);font-weight:600;}

  .bank-entry{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;position:relative;}

  .status-pending{background:var(--gold-soft);color:#8A5F1F;}
  .status-cutting{background:var(--gold-soft);color:#8A5F1F;}
  .status-sewing{background:var(--gold-soft);color:#8A5F1F;}
  .status-fitting{background:var(--gold-soft);color:#8A5F1F;}
  .status-ready{background:var(--green-soft);color:var(--green);}
  .status-delivered{background:var(--green-soft);color:var(--green);}
  .status-cancelled{background:#EDEAE0;color:var(--ink-soft);}

  .empty{color:var(--ink-soft);font-size:13.5px;padding:6px 0;}
  .rowline{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
  .rowline:last-child{border-bottom:none;}

  .welcome-shell{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
  .welcome-hero{position:relative;height:54%;flex-shrink:0;overflow:hidden;background:var(--ink);}
  .welcome-track{display:flex;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);}
  .welcome-slide{min-width:100%;height:100%;position:relative;}
  .welcome-slide img{width:100%;height:100%;object-fit:cover;display:block;}
  .welcome-caption{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 16px;
    background:linear-gradient(to top, rgba(10,8,6,0.72), rgba(10,8,6,0));color:#fff;}
  .welcome-caption .wname{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
  .welcome-caption .wcat{font-size:11px;opacity:.75;margin-top:1px;}
  .welcome-caption .wprice{font-family:'IBM Plex Mono',monospace;font-size:14.5px;margin-top:4px;font-weight:500;}
  .welcome-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2;}
  .welcome-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.5);border:none;padding:0;}
  .welcome-dot.active{background:#fff;width:16px;border-radius:4px;}
  .welcome-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,8,6,0.35);color:#fff;
    border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;}
  .welcome-arrow.prev{left:8px;} .welcome-arrow.next{right:8px;}
  .welcome-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgba(255,255,255,0.75);}
  .welcome-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 24px;gap:12px;min-height:0;}
  .welcome-logo{width:60px;height:60px;border-radius:16px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:22px;overflow:hidden;}
  .welcome-logo img{width:100%;height:100%;object-fit:cover;}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ================= GUIDED TOUR ================= */
  #tourOverlay{position:fixed;inset:0;z-index:9999;}
  .tour-backdrop{position:fixed;inset:0;background:transparent;transition:background .15s ease;}
  .tour-backdrop.dim{background:rgba(20,16,10,0.6);}
  .tour-spot{position:fixed;border:2px solid var(--gold);border-radius:12px;
    box-shadow:0 0 0 9999px rgba(20,16,10,0.6), 0 0 0 5px rgba(184,132,46,0.25);
    pointer-events:none;transition:top .2s ease,left .2s ease,width .2s ease,height .2s ease;}
  .tour-panel{position:fixed;left:12px;right:12px;bottom:12px;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -6px 4px rgba(0,0,0,.03), 0 10px 30px rgba(0,0,0,.22);
    max-width:440px;margin:0 auto;}
  .tour-panel.centered{position:fixed;top:50%;left:50%;right:auto;bottom:auto;
    transform:translate(-50%,-50%);width:88%;max-width:360px;text-align:center;}
  .tour-eyebrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .tour-step-label{font-size:11px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;}
  .tour-skip{font-size:11.5px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:inherit;}
  .tour-title{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;margin-bottom:5px;line-height:1.3;}
  .tour-body{font-size:13px;color:var(--ink-soft);line-height:1.55;margin-bottom:14px;}
  .tour-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .tour-dots{display:flex;gap:4px;align-items:center;}
  .tour-dot{width:5px;height:5px;border-radius:50%;background:var(--line);flex-shrink:0;}
  .tour-dot.active{background:var(--gold);width:14px;border-radius:3px;}
  .tour-panel.centered .tour-actions{justify-content:center;}
  .tour-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--primary);color:#fff;border:none;}
  .tour-banner .disp{color:#fff;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= ICONS ================= */
const ICONS = {
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>',
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',

  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',

  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9.5h18"/><path d="M8 3v4.5M16 3v4.5"/>',
  scissors:'<circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><path d="M8 8l11 11M19 5L8 16"/>',

  gallery:'<rect x="3" y="3" width="7" height="7" rx="1.3"/><rect x="14" y="3" width="7" height="7" rx="1.3"/><rect x="3" y="14" width="7" height="7" rx="1.3"/><rect x="14" y="14" width="7" height="7" rx="1.3"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',

  fingerprint:'<path d="M12 2a8 8 0 0 1 8 8c0 2-.3 3.8-.9 5.5"/><path d="M6.1 5.8A8 8 0 0 0 4 10c0 4-1 7-2 8.5"/><path d="M12 6a6 6 0 0 1 6 6c0 3.5-.7 6-1.6 7.7"/><path d="M8 7.6A6 6 0 0 0 6 10c0 5-1.2 7.5-2 8.7"/><path d="M12 10a2 2 0 0 1 2 2c0 3.5-.7 6.2-2 8.3"/><path d="M10 10.3a2 2 0 0 0-1 1.7c0 3-.5 5.5-1.7 7.7"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.8 2.8 0 0 1 5.4.9c0 1.8-2.6 2.3-2.6 4"/><circle cx="12" cy="17" r=".35" fill="currentColor"/>',
};
function icon(name,size){ size=size||16; return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="'+size+'" height="'+size+'" aria-hidden="true">'+(ICONS[name]||'')+'</svg>'; }

/* ================= HELPERS ================= */
const THEMES = {
  indigo:     { label:"Indigo & Gold",    vars:{ bg:"#E7E1D3", surface:"#FBF9F3", ink:"#26221B", "ink-soft":"#645E50", primary:"#1E3A3A", "primary-dark":"#122626", gold:"#B8842E", "gold-soft":"#E7D2A4", rust:"#A2432B", "rust-soft":"#F0DAD1", line:"#D6CDB6", green:"#3E6B4F", "green-soft":"#DCE9DD" } },

function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 480; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > height){ if(width > maxDim){ height = Math.round(height*(maxDim/width)); width = maxDim; } }
        else{ if(height > maxDim){ width = Math.round(width*(maxDim/height)); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ================= ALERTS / NOTIFICATIONS =================
   Flags orders whose due date is near, today, or already passed —
   split into "delivery" (order not yet marked Delivered) and
   "payment" (order still has an outstanding balance) reminders. */
const NEAR_DUE_DAYS = 3;
function buildAlerts(){
  const overdue = [], dueToday = [], nearDue = [];
  state.orders.forEach(o=>{
    if(o.status==="Cancelled") return;
    const dleft = daysUntil(o.dueDate);
    if(dleft===null || dleft>NEAR_DUE_DAYS) return;
    const bal = orderTotal(o)-orderPaid(o);
    const kinds = [];
    if(o.status!=="Delivered") kinds.push("delivery");
    if(bal>0) kinds.push("payment");
    if(kinds.length===0) return;
    const entry = { o, bal, dleft, kinds, client: state.clients.find(c=>c.id===o.clientId) };
    if(dleft<0) overdue.push(entry);
    else if(dleft===0) dueToday.push(entry);
    else nearDue.push(entry);
  });
  const byDleft = (a,b)=>a.dleft-b.dleft;
  overdue.sort(byDleft); dueToday.sort(byDleft); nearDue.sort(byDleft);
  return { overdue, dueToday, nearDue, total: overdue.length+dueToday.length+nearDue.length };
}

function buildInvoiceText(order, client, business, kind){
  const total = orderTotal(order), paid = orderPaid(order), bal = total - paid;
  const lines = [];
  lines.push("*"+business.name+"*");
  if(business.address) lines.push(business.address);
  if(business.phone) lines.push(business.phone);
  if(business.regNumber) lines.push("RC: "+business.regNumber);
  lines.push("—————————————");
  lines.push(kind==="receipt" ? "RECEIPT" : "INVOICE");
  lines.push("Client: "+(client?client.name:"—"));
  lines.push("Order: "+(order.title||"Untitled order"));
  lines.push("Date: "+fmtDate(todayISO()));
  lines.push("");
  (order.items||[]).forEach(it => lines.push(it.desc+" — "+money(it.price, business.currency)));
  lines.push("—————————————");
  lines.push("Total: "+money(total, business.currency));
  lines.push("Paid: "+money(paid, business.currency));
  lines.push("Balance: "+money(bal, business.currency));
  if(order.dueDate) lines.push("Due date: "+fmtDate(order.dueDate));
  if(bal > 0 && business.bankAccounts && business.bankAccounts.length > 0){
    lines.push("");
    lines.push(business.bankAccounts.length > 1 ? "Pay into any of:" : "Pay into:");
    business.bankAccounts.forEach((acc,i) => {
      if(business.bankAccounts.length > 1) lines.push("Option "+(i+1)+":");
      if(acc.accountName) lines.push(acc.accountName);
      if(acc.bankName) lines.push(acc.bankName);
      if(acc.accountNumber) lines.push(acc.accountNumber);
    });
  }
  lines.push("");
  lines.push("Thank you for your patronage!");
  return lines.join("\n");
}

/* ================= BACK NAVIGATION =================
   Real hardware/gesture back presses walk out one screen at a time
   (modal -> client detail -> tab -> welcome), and pressing
   back again from the welcome screen shows a "tap back again to exit"
   prompt before actually closing the app. Manual UI actions (Cancel,
   Save, tapping the Dashboard tab, the logo) perform the same state
   change directly and quietly keep the browser history stack in sync
   via collapseNav(), so hardware back always stays correct afterwards. */
let navDepth = 0;
let suppressPop = false;
let exitArmed = false;
let exitTimer = null;

function pushNav(){
  if(suppressPop) return;
  navDepth++;
  history.pushState({d:navDepth}, "", location.href);
}
function collapseNav(steps){
  steps = Math.min(steps||1, navDepth);
  if(steps<=0) return;
  suppressPop = true;
  navDepth -= steps;
  history.go(-steps);
  setTimeout(() => { suppressPop = false; }, 60);
}

        '<button id="lightboxNext" style="background:rgba(255,255,255,.15);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:19px;cursor:pointer;">›</button>'+
      '</div>';
    document.body.appendChild(el);

    document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
    document.getElementById("lightboxPrev").addEventListener("click", () => lightboxStep(-1));
    document.getElementById("lightboxNext").addEventListener("click", () => lightboxStep(1));

    let sx=0, sy=0, startPanX=0, startPanY=0, pinchStartDist=0, pinchStartScale=1, lastTapT=0;
    const dist = (touches) => { const dx=touches[0].clientX-touches[1].clientX, dy=touches[0].clientY-touches[1].clientY; return Math.sqrt(dx*dx+dy*dy); };

    el.addEventListener("touchstart", (e) => {
      if(e.touches.length===2){
        pinchStartDist = dist(e.touches);
        pinchStartScale = lbScale;
      } else if(e.touches.length===1){
        const t=e.touches[0]; sx=t.clientX; sy=t.clientY; startPanX=lbPanX; startPanY=lbPanY;
      }
    }, {passive:true});

    el.addEventListener("touchmove", (e) => {
      if(e.touches.length===2){
        e.preventDefault();
        const d = dist(e.touches);
        lbScale = Math.min(4, Math.max(1, pinchStartScale * (d/pinchStartDist)));
        lbApplyTransform();
      } else if(e.touches.length===1 && lbScale>1.02){
        e.preventDefault();
        const t=e.touches[0];
        lbPanX = startPanX + (t.clientX-sx);
        lbPanY = startPanY + (t.clientY-sy);
        lbApplyTransform();
      }
    }, {passive:false});

    el.addEventListener("touchend", (e) => {
      if(e.touches.length>0) return;
      const t = e.changedTouches[0];
      const dx = t.clientX-sx, dy = t.clientY-sy;
      const now = Date.now();

      if(now-lastTapT < 320 && Math.abs(dx)<12 && Math.abs(dy)<12){
        lastTapT = 0;
        if(lbScale>1.02) lbResetZoom();
        else { lbScale = 2.2; lbPanX = 0; lbPanY = 0; lbApplyTransform(); }
        return;
      }
      lastTapT = now;

      if(lbScale<=1.02){
        if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) lightboxStep(dx<0?1:-1);
        else if(dy>90 && Math.abs(dy)>Math.abs(dx)) closeLightbox();
      }
    }, {passive:true});
  }
  return el;
}
function lightboxStep(dir){
  if(!state.lightbox) return;
  const n = state.lightbox.images.length;
  state.lightbox.index = (state.lightbox.index + dir + n) % n;
  lbResetZoom();
  updateLightboxUI();
}
function updateLightboxUI(){
  const el = ensureLightboxEl();
  if(!state.lightbox){ el.style.display = "none"; return; }
  const {images, index, tags} = state.lightbox;
  el.style.display = "flex";
  lbResetZoom();
  document.getElementById("lightboxImg").src = images[index];
  document.getElementById("lightboxCounter").textContent = images.length>1 ? (index+1)+" / "+images.length : "";
  const multi = images.length>1;
  document.getElementById("lightboxPrev").style.display = multi?"flex":"none";
  document.getElementById("lightboxNext").style.display = multi?"flex":"none";
  const tagEl = document.getElementById("lightboxTag");
  if(tagEl){
    const t = tags && tags[index];
    if(t){ tagEl.textContent = t; tagEl.style.display = "block"; }
    else { tagEl.style.display = "none"; }
  }
  const hint = document.getElementById("lightboxHint");
  if(hint){
    hint.style.transition = "none"; hint.style.opacity = "1";
    clearTimeout(hint._fadeTimer);
    hint._fadeTimer = setTimeout(() => { hint.style.transition = "opacity .5s"; hint.style.opacity = "0"; }, 2200);
  }
}
function openLightbox(images, index, tags){
  if(!images || images.length===0) return;
  state.lightbox = { images: images, index: index||0, tags: tags||null };
  pushNav();
  updateLightboxUI();
}
function closeLightbox(){
  state.lightbox = null;
  collapseNav(1);
  updateLightboxUI();

/* ================= FINGERPRINT (WEBAUTHN) SIGN-IN ================= */
let biometricAutoAttempted = false;
function supportsWebAuthn(){ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
function bufToB64(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64ToBuf(b64){ b64 = b64.replace(/-/g,'+').replace(/_/g,'/'); while(b64.length%4) b64+='='; const bin=atob(b64); const buf=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i); return buf.buffer; }
function getBiometricRecord(){ try{ const s = localStorage.getItem("biometricCred"); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function hasBiometricForAccount(){ const rec = getBiometricRecord(); return !!(rec && state.account && rec.email===state.account.email); }
async function registerBiometric(){
  if(!supportsWebAuthn() || !state.account) return false;
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({ publicKey: {
      challenge, rp:{ name:"Tailor Studio" },
      user:{ id:userId, name: state.account.email, displayName: state.account.name || state.account.email },
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:"platform", userVerification:"required" },
      timeout: 60000,
    }});
    if(!cred) return false;
    localStorage.setItem("biometricCred", JSON.stringify({ email: state.account.email, credId: bufToB64(cred.rawId) }));
    return true;
  }catch(e){ return false; }
}
async function tryBiometricSignIn(auto){
  if(!supportsWebAuthn()) return false;
  const rec = getBiometricRecord();
  if(!rec || !state.account || rec.email !== state.account.email) return false;
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const assertion = await navigator.credentials.get({ publicKey: {
      challenge, allowCredentials:[{ id: b64ToBuf(rec.credId), type:"public-key" }],
      userVerification:"required", timeout: 60000,
    }});
    if(assertion){
      state.authed = true; state.viewOnly = false; state.authError = null;
      render();
      return true;
    }
  }catch(e){
    if(!auto){ state.authError = "Fingerprint sign-in failed or was cancelled."; render(); }
  }
  return false;
}

async function cardToFile(html, filenameBase, widthPx){
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-9999px;top:0;";
  holder.style.width = (widthPx||480)+"px";
  holder.innerHTML = html;
  document.body.appendChild(holder);
  try{
    const canvas = await html2canvas(holder, {backgroundColor:"#ffffff", scale:2});
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    return new File([blob], filenameBase+".png", {type:"image/png"});
  } finally {
    document.body.removeChild(holder);
  }
}
function downloadFile(file){
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function shareImageFile(file, caption, phone){
  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{ await navigator.share({files:[file], text: caption||"", title: file.name}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  // Fallback when the Web Share API (with files) isn't supported: download the
  // image so it can be attached manually, and open WhatsApp with the caption —
  // a plain wa.me link cannot carry an image itself.
  downloadFile(file);
  window.open(waLink(phone||"", caption||""), "_blank", "noreferrer");
}

  const caption = (kind==="receipt"?"Receipt":"Invoice")+" from "+(business.name||"")+(order.title?(" — "+order.title):"");

function renderDashboardCharts(){
  const orders = state.orders, business = state.business;
  const revBy = {}; orders.forEach(o=> (o.payments||[]).forEach(p=>{
    const d = new Date(p.date+"T00:00:00"); const key = d.toLocaleDateString(undefined,{month:"short"});
    revBy[key] = (revBy[key]||0) + Number(p.amount||0);
  }));
  const now = new Date(); const labels=[]; const data=[];
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); const key=d.toLocaleDateString(undefined,{month:"short"}); labels.push(key); data.push(revBy[key]||0); }

  const statusBy = {}; orders.forEach(o=>{ statusBy[o.status] = (statusBy[o.status]||0)+1; });
  const sLabels = Object.keys(statusBy); const sData = sLabels.map(k=>statusBy[k]);
  const palette = ["#1E3A3A","#B8842E","#A2432B","#3E6B4F","#8C7B5A","#645E50","#C79A4B"];

  const revCanvas = document.getElementById("revChart");
  if(revCanvas && window.Chart){
    if(dashCharts.bar) dashCharts.bar.destroy();
    dashCharts.bar = new Chart(revCanvas, {
      type:"bar",
      data:{ labels, datasets:[{ label:"Revenue", data, backgroundColor:"#1E3A3A", borderRadius:4, maxBarThickness:36 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(ctx)=> money(ctx.parsed.y, business.currency) } } },
        scales:{ y:{ beginAtZero:true, grid:{color:"#D6CDB6"}, ticks:{color:"#645E50", font:{size:11}} },
                 x:{ grid:{display:false}, ticks:{color:"#645E50", font:{size:12}} } } }
    });
  }
  const statusCanvas = document.getElementById("statusChart");
  if(statusCanvas && window.Chart){
    if(dashCharts.pie) dashCharts.pie.destroy();
    dashCharts.pie = new Chart(statusCanvas, {
      type:"doughnut",
      data:{ labels:sLabels, datasets:[{ data:sData, backgroundColor: sLabels.map((_,i)=>palette[i%palette.length]), borderColor:"#FBF9F3", borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:"bottom", labels:{ boxWidth:10, font:{size:11}, color:"#26221B" } } } }
    });
  }
}

function buildFullGallery(categoryId){
  // Collects every photo across the catalogue — priced-item photos and
  // category gallery photos alike — each tagged with its category (and
  // item name, where relevant) so the swipe-through view stays legible.
  const cats = state.catalogue.categories;
  const catName = (id) => { const c = cats.find(x=>x.id===id); return c ? c.name : "Uncategorised"; };
  const images = [], tags = [];
  state.catalogue.items.forEach(it=>{
    if(categoryId && it.categoryId!==categoryId) return;
    (it.images||[]).forEach(src=>{
      images.push(src);
      tags.push(catName(it.categoryId) + (it.name ? " · "+it.name : ""));
    });
  });
  cats.forEach(cat=>{
    if(categoryId && cat.id!==categoryId) return;
    (cat.gallery||[]).forEach(src=>{
      images.push(src);
      tags.push(cat.name);
    });
  });
  return { images: images, tags: tags };
}
function renderCatalogue(){

  const items = isAll ? state.catalogue.items.slice() : (activeCat ? state.catalogue.items.filter(i=>i.categoryId===activeCat.id) : []);

      '<div class="chipbar">'+

        '<button class="btn ghost sm" data-action="download-pricelist-image">'+icon("download",14)+' Download</button>'+
      '</div>'+
    '</div>'+
    (cats.length===0 ? '<div class="empty">No categories yet — add some from Account &gt; Manage catalogue.</div>' :

function buildCatalogueShareText(){
  const business = state.business;
  const lines = ["*"+business.name+" — Price List*", ""];
  state.catalogue.categories.forEach(cat=>{
    const items = state.catalogue.items.filter(i=>i.categoryId===cat.id);
    if(items.length===0) return;
    lines.push("*"+cat.name+"*");
    items.forEach(i=>lines.push("• "+i.name+" — "+money(i.price,business.currency)));
    lines.push("");
  });
  if(business.phone) lines.push("Contact us: "+business.phone);
  return lines.join("\n");
}

  if(state.modal.type==="client") return renderClientModal();
  if(state.modal.type==="order") return renderOrderModal();
  if(state.modal.type==="catitem") return renderCatItemModal();
  if(state.modal.type==="catitem-view") return renderCatItemView();
  if(state.modal.type==="catpicker") return renderCatalogPickerModal();
  if(state.modal.type==="notifications") return renderNotificationsModal();
  if(state.modal.type==="contact-dev") return renderContactDevModal();

}

}

function renderNotificationsModal(){
  const alerts = buildAlerts();
  const business = state.business;
  const kindPill = (k) => k==="payment" ?
    '<span class="pill" style="background:var(--rust-soft);color:var(--rust);">Payment</span>' :
    '<span class="pill" style="background:var(--gold-soft);color:#8A5F1F;">Delivery</span>';
  const section = (title, list, tone) => {
    if(list.length===0) return "";
    return '<div style="margin-bottom:18px;">'+
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:'+tone+';margin-bottom:6px;">'+esc(title)+' ('+list.length+')</div>'+
      list.map(({o,bal,dleft,kinds,client}) => (
        '<div class="rowline" style="align-items:flex-start;gap:8px;">'+
          '<div style="cursor:pointer;flex:1;min-width:0;" data-action="open-order-modal" data-id="'+o.id+'">'+
            '<div style="font-weight:500;font-size:13.5px;">'+esc(client?client.name:"Unknown client")+' — '+esc(o.title||"Order")+'</div>'+
            '<div style="font-size:11.5px;color:'+(dleft<0?"var(--rust)":"var(--ink-soft)")+';margin-top:1px;">'+
              (dleft<0 ? Math.abs(dleft)+"d overdue" : dleft===0 ? "Due today" : "Due in "+dleft+"d")+
              (kinds.includes("payment") ? " · Balance "+money(bal,business.currency) : "")+
            '</div>'+
            '<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;">'+kinds.map(kindPill).join("")+'</div>'+
          '</div>'+
          (client ? '<button class="btn wa sm" data-action="share-reminder-image-dash" data-id="'+o.id+'" style="flex-shrink:0;">'+icon("send",13)+'</button>' : '')+
        '</div>'
      )).join("")+
    '</div>';
  };
  const body = alerts.total===0 ?
    '<div class="empty">All caught up — nothing due, overdue, or coming up in the next '+NEAR_DUE_DAYS+' days.</div>' :
    section("Overdue", alerts.overdue, "var(--rust)")+
    section("Due today", alerts.dueToday, "var(--gold)")+
    section("Due soon", alerts.nearDue, "var(--ink-soft)");
  return modalShell("Notifications", body);
}

function goToWelcomeSlide(index){

async function pickContactPhone(){
  if(!(navigator.contacts && navigator.contacts.select)){
    alert("Picking from contacts isn't supported on this browser/device. You can still type the number in manually.");
    return;
  }
  try{
    const picked = await navigator.contacts.select(["name","tel"], {multiple:false});
    if(!picked || !picked[0]) return;
    const contact = picked[0];
    const rawPhone = (contact.tel && contact.tel[0]) || "";
    const phone = rawPhone.replace(/[^0-9+]/g,"");
    if(phone && state.modal && state.modal.type==="client"){
      state.modal.draft.phone = phone;
      if(!state.modal.draft.name.trim() && contact.name && contact.name[0]){
        state.modal.draft.name = contact.name[0];
      }
      render();
    }
  }catch(e){ /* user cancelled the picker, or permission was denied */ }
}

async function shareCatalogueItem(id){
  const it = findCatItem(id);
  if(!it) return;
  const business = state.business;
  const text = "*"+it.name+"*\n"+(it.description?it.description+"\n":"")+money(it.price,business.currency)+(business.name?"\n\n"+business.name:"");
  const img = it.images && it.images[0];
  if(img && navigator.share){
    try{
      const res = await fetch(img);
      const blob = await res.blob();
      const file = new File([blob], (it.name||"item").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".jpg", {type: blob.type||"image/jpeg"});
      if(!navigator.canShare || navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text: text, title: it.name});
        return;
      }
    }catch(e){ /* fall through to text-only link below */ }
  }
  window.open(waLink("", text), "_blank", "noreferrer");
}

let tourResizeBound = false;
function startTour(){
  if(!state.authed || state.showWelcome) return;
  collapseNav(navDepth);
  state.modal = null; state.selectedClientId = null; state.lightbox = null; state.tab = "dashboard";
  markTourSeen();
  state.tour = { step: 0 };
  goToTourStep(0);
  if(!tourResizeBound){
    tourResizeBound = true;
    window.addEventListener("resize", () => { if(state.tour) renderTourOverlay(); });
  }
}
function goToTourStep(i){
  if(!state.tour) return;
  if(i < 0){ return; }
  if(i >= TOUR_STEPS.length){ endTour(); return; }
  state.tour.step = i;
  const step = TOUR_STEPS[i];
  if(step.tab && state.tab !== step.tab){
    const wasHome = state.tab === "dashboard";
    state.tab = step.tab; state.selectedClientId = null;
    if(wasHome && step.tab !== "dashboard") pushNav();
    else if(!wasHome && step.tab === "dashboard") collapseNav(1);
  }
  render();
}
function nextTour(){ if(state.tour) goToTourStep(state.tour.step + 1); }
function prevTour(){ if(state.tour) goToTourStep(state.tour.step - 1); }
function endTour(){
  state.tour = null;
  const ov = document.getElementById("tourOverlay");
  if(ov) ov.remove();
  render();
}
function renderTourOverlay(){
  let overlay = document.getElementById("tourOverlay");
  if(!state.tour){ if(overlay) overlay.remove(); return; }
  if(!overlay){
    overlay = document.createElement("div");
    overlay.id = "tourOverlay";
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => {
      const el = e.target.closest("[data-tour-action]");
      if(!el) return;
      const act = el.getAttribute("data-tour-action");
      if(act === "next") nextTour();
      else if(act === "prev") prevTour();
      else if(act === "skip" || act === "finish") endTour();
    });
  }
  const idx = state.tour.step;
  const step = TOUR_STEPS[idx];
  let target = null;
  if(step && step.getTarget){ try{ target = step.getTarget(); }catch(e){ target = null; } }
  if(target && target.scrollIntoView) target.scrollIntoView({block:"center", behavior:"auto"});
  requestAnimationFrame(() => { paintTourOverlay(overlay, step, target, idx, TOUR_STEPS.length); });
}
function paintTourOverlay(overlay, step, target, idx, total){
  if(!state.tour) return;
  const rect = target ? target.getBoundingClientRect() : null;
  const pad = 6;
  const dots = TOUR_STEPS.map((_,i)=>'<span class="tour-dot '+(i===idx?"active":"")+'"></span>').join("");
  const isFirst = idx === 0, isLast = idx === total - 1;
  const panelClass = rect ? "tour-panel" : "tour-panel centered";
  const panelHtml =
    '<div class="'+panelClass+'">'+
      '<div class="tour-eyebrow"><span class="tour-step-label">Step '+(idx+1)+' of '+total+'</span>'+
        (isLast ? '' : '<button class="tour-skip" data-tour-action="skip">Skip tour</button>')+
      '</div>'+
      '<div class="tour-title">'+esc(step.title)+'</div>'+
      '<div class="tour-body">'+esc(step.body)+'</div>'+
      '<div class="tour-actions">'+
        (isFirst ? '<span></span>' : '<button class="btn ghost sm" data-tour-action="prev">'+icon("back",13)+' Back</button>')+
        '<div class="tour-dots">'+dots+'</div>'+
        (isLast ?
          '<button class="btn gold sm" data-tour-action="finish">'+icon("check",13)+' Done</button>' :
          '<button class="btn gold sm" data-tour-action="next">Next '+icon("forward",13)+'</button>')+
      '</div>'+
    '</div>';
  overlay.innerHTML =
    '<div class="tour-backdrop '+(rect ? "" : "dim")+'"></div>'+
    (rect ?
      '<div class="tour-spot" style="top:'+(rect.top-pad)+'px;left:'+(rect.left-pad)+'px;width:'+(rect.width+pad*2)+'px;height:'+(rect.height+pad*2)+'px;"></div>'
      : '')+
    panelHtml;
}

document.addEventListener("click", (e) => {
  const stop = e.target.closest('[data-stop]');
  const backdrop = e.target.closest('[data-action="modal-backdrop"]');
  if(backdrop && !stop && e.target === backdrop){ closeModal(); return; }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  const id = el.getAttribute("data-id");

  if(state.viewOnly && MUTATING_ACTIONS.has(action)){
    showViewOnlyToast();
    return;
  }

  switch(action){
    case "start-tour": startTour(); break;
    case "dismiss-tour-banner": markTourSeen(); render(); break;
    case "set-tab": {
      const newTab = el.getAttribute("data-tab");
      const wasHome = state.tab === "dashboard";
      state.tab = newTab; state.selectedClientId = null;
      if(wasHome && newTab !== "dashboard") pushNav();
      else if(!wasHome && newTab === "dashboard") collapseNav(1);
      render();
      break;
    }
    case "select-client": state.selectedClientId = id; pushNav(); render(); break;
    case "back-to-clients": state.selectedClientId = null; collapseNav(1); render(); break;
    case "delete-client": if(confirm("Delete this client? This cannot be undone.")){ state.clients = state.clients.filter(c=>c.id!==id); if(state.selectedClientId===id){ state.selectedClientId=null; collapseNav(1); } persistClients(); render(); } break;
    case "open-client-modal-new": openClientModal(null); break;
    case "open-client-modal": openClientModal(findClient(id)); break;
    case "pick-contact-phone": pickContactPhone(); break;
    case "save-client": {
      const c = state.modal.draft;
      if(!c.name.trim()) return;
      const exists = state.clients.some(x=>x.id===c.id);
      state.clients = exists ? state.clients.map(x=>x.id===c.id?c:x) : state.clients.concat([c]);
      persistClients();
      if(state.selectedClientId===c.id) {} // detail will re-render from state.clients
      closeModal();
      break;
    }
    case "open-order-modal-new": openOrderModal(null); break;
    case "open-order-modal-new-for-client": openOrderModal(null, id); break;
    case "open-order-modal": openOrderModal(findOrder(id)); break;
    case "open-notifications": state.modal = { type:"notifications" }; pushNav(); render(); break;
    case "copy-text": {
      const value = el.getAttribute("data-value")||"";
      const restoreHtml = el.innerHTML;
      const flash = (ok) => {
        el.innerHTML = icon(ok?"check":"x",13)+" "+(ok?"Copied!":"Couldn't copy");
        clearTimeout(el._copyTimer);
        el._copyTimer = setTimeout(() => { el.innerHTML = restoreHtml; }, 1600);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(value).then(()=>flash(true)).catch(()=>flash(false));
      } else {
        try{
          const ta = document.createElement("textarea");
          ta.value = value; ta.style.position="fixed"; ta.style.opacity="0";
          document.body.appendChild(ta); ta.select();
          document.execCommand("copy"); document.body.removeChild(ta);
          flash(true);
        }catch(e){ flash(false); }
      }
      break;
    }
    case "add-order-item": state.modal.draft.items.push({desc:"",price:""}); render(); break;
    case "remove-order-item": state.modal.draft.items.splice(Number(el.getAttribute("data-index")),1); render(); break;
    case "add-payment": {
      const amt = Number(state.modal.payAmt);
      if(!amt || amt<=0) return;
      state.modal.draft.payments.push({ id:uid(), amount:amt, date: todayISO(), method: state.modal.payMethod||"Cash" });
      state.modal.payAmt = "";
      render();
      break;
    }
    case "remove-payment": state.modal.draft.payments = state.modal.draft.payments.filter(p=>p.id!==id); render(); break;
    case "save-order": {
      const o = state.modal.draft;
      if(!o.clientId) return;
      o.items = o.items.filter(it => (it.desc && it.desc.trim()) || Number(it.price)>0);
      if(o.items.length===0) o.items = [{desc:"",price:0}];
      const exists = state.orders.some(x=>x.id===o.id);
      state.orders = exists ? state.orders.map(x=>x.id===o.id?o:x) : state.orders.concat([o]);

      closeModal();

    case "biometric-sign-in": tryBiometricSignIn(false); break;
    case "view-demo-account": {
      seedDemoData(false); // in-memory only — leaves the real account's saved data untouched
      state.demoPreview = true;
      state.authed = true; state.viewOnly = true; state.authError = null;
      state.modal = null; state.selectedClientId = null; state.tab = "dashboard";
      state.showWelcome = false;
      pushNav();
      render();
      break;
    }
    case "sign-up": {
      const f = state.authForm || {};
      const name = (f.name||"").trim();
      const email = (f.email||"").trim().toLowerCase();
      const password = f.password||"";
      const key = f.key||"";
      if(!email || !password){
        state.authError = "Please fill in your email and password.";
      } else if(password.length < 6){
        state.authError = "Password should be at least 6 characters.";
      } else if(password !== f.confirm){
        state.authError = "Passwords don't match.";
      } else if(key !== SIGNUP_KEY){
        state.authError = "Incorrect access key.";
      } else {
        // Wipe the demo data — the new account starts with a clean slate.
        state.clients = [];
        state.orders = [];
        state.catalogue = { categories: [], items: [] };
        state.business = { name: name||"My Tailor Shop", phone:"", address:"", currency: state.business.currency||"₦", regNumber:"", bankAccounts:[], logo:null };
        persistClients(); persistOrders(); persistCatalogue(); persistBusiness();
        state.account = { name, email, password };
        persistAccount();
        state.authed = true; state.authError = null; state.authMode = "signin"; state.viewOnly = false;
        state.authForm = null;
        if(supportsWebAuthn()){
          setTimeout(() => { if(confirm("Enable fingerprint sign-in on this device for next time?")) registerBiometric(); }, 300);
        }
      }
      render();
      break;
    }
    case "toggle-auth-mode": {
      state.authMode = (state.authMode==="signup") ? "signin" : "signup";
      state.authForm = null; state.authError = null;
      render();
      break;
    }
    case "sign-out": {
      if(state.demoPreview){ loadRealDataFromStorage(); state.demoPreview = false; }
      state.authed = false;
      state.viewOnly = false;
      state.authMode = "signin";
      state.authForm = { email: (state.account&&state.account.email)||DEMO_EMAIL, password: state.account?"":DEMO_PASSWORD };
      state.authError = null;
      state.modal = null; state.selectedClientId = null; state.tab = "dashboard";
      state.showWelcome = true;
      biometricAutoAttempted = false;
      collapseNav(navDepth);
      render();
      break;
    }
    case "enter-shop": state.showWelcome = false; pushNav(); render(); break;
    case "open-welcome": {
      state.modal = null; state.selectedClientId = null;
      state.tab = "dashboard"; state.showWelcome = true; state.welcomeIndex = 0;
      collapseNav(navDepth);
      render();
      break;
    }
    case "welcome-goto": goToWelcomeSlide(Number(el.getAttribute("data-index"))); startWelcomeCarousel(); break;
    case "welcome-prev": goToWelcomeSlide(state.welcomeIndex - 1); startWelcomeCarousel(); break;
    case "welcome-next": goToWelcomeSlide(state.welcomeIndex + 1); startWelcomeCarousel(); break;
    case "select-theme": {
      const key = el.getAttribute("data-theme");
      applyTheme(key);
      persist("theme", key);
      render();
      break;
    }
    case "add-bank-account": {
      if(!state.business.bankAccounts) state.business.bankAccounts = [];
      state.business.bankAccounts.push({ id:uid(), bankName:"", accountName:"", accountNumber:"" });
      persistBusiness(); render();
      break;
    }
    case "remove-bank-account": {
      state.business.bankAccounts.splice(Number(el.getAttribute("data-index")),1);
      persistBusiness(); render();
      break;
    }
    case "export-data": exportBackup(); break;
    case "download-user-guide": downloadUserGuide(); break;
    case "open-contact-dev-modal": state.modal = { type:"contact-dev" }; pushNav(); render(); break;
  }
});

function exportBackup(){
  const backup = {
    app: "Tailor Studio", version: 1, exportedAt: new Date().toISOString(),
    clients: state.clients, orders: state.orders, catalogue: state.catalogue,
    business: state.business, theme: state.theme || "indigo",
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = "tailor-studio-backup-"+stamp+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const AUTO_BACKUP_INTERVALS = { daily:1, weekly:7, monthly:30 };
function nextAutoBackupDate(){
  const bs = state.backupSettings;
  if(!bs || !bs.enabled) return null;
  const days = AUTO_BACKUP_INTERVALS[bs.frequency] || 7;
  const base = bs.lastBackupAt ? new Date(bs.lastBackupAt) : new Date();
  return new Date(base.getTime() + days*24*60*60*1000);
}
function autoBackupStatusText(){
  const bs = state.backupSettings;
  if(!bs || !bs.enabled) return "Off — a backup file will only be created when you tap Export.";
  const next = nextAutoBackupDate();
  const freqLabel = {daily:"Daily",weekly:"Weekly",monthly:"Monthly"}[bs.frequency] || "Weekly";
  return freqLabel+" · next backup around "+fmtDateTime(next)+(bs.lastBackupAt ? " (last: "+fmtDateTime(new Date(bs.lastBackupAt))+")" : "");
}
// Runs on every render while signed in. Cheap date comparison; only does real
// work (an export + persist) on the rare render where a backup is actually due,
// and updates lastBackupAt in memory immediately so it won't re-trigger on the
// next render before the debounced persist() write lands.
function checkAutoBackup(){
  const bs = state.backupSettings;
  if(!bs || !bs.enabled || state.viewOnly || !state.authed) return;
  const days = AUTO_BACKUP_INTERVALS[bs.frequency] || 7;
  const last = bs.lastBackupAt ? new Date(bs.lastBackupAt) : null;
  const now = new Date();
  if(!last || (now - last) >= days*24*60*60*1000){
    try{ exportBackup(); }catch(e){}
    bs.lastBackupAt = now.toISOString();
    persistBackupSettings();
  }
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== "object") throw new Error("bad file");
      const ok = confirm("Import this backup? This will replace all clients, orders, catalogue and settings currently on this device.");
      if(!ok) return;
      if(Array.isArray(data.clients)) state.clients = data.clients;
      if(Array.isArray(data.orders)) state.orders = data.orders;
      if(data.catalogue && typeof data.catalogue === "object") state.catalogue = data.catalogue;
      if(data.business && typeof data.business === "object") state.business = Object.assign({}, state.business, data.business);
      if(!state.business.bankAccounts) state.business.bankAccounts = [];
      if(data.theme) applyTheme(data.theme);
      persistClients(); persistOrders(); persistCatalogue(); persistBusiness(); persist("theme", state.theme||"indigo");
      state.activeCategoryId = state.catalogue.categories[0] ? state.catalogue.categories[0].id : null;
      render();
      alert("Backup imported successfully.");
    }catch(e){
      alert("Couldn't read that file. Make sure it's a Tailor Studio backup exported from this app.");
    }
  };
  reader.readAsText(file);
}

document.addEventListener("input", (e) => {
  const bindEl = e.target.closest("[data-bind]");
  if(bindEl){
    const path = bindEl.getAttribute("data-bind");
    if(state.viewOnly && !path.startsWith("authForm.")){ showViewOnlyToast(); e.target.value = getPath(state, path) || ""; return; }
    setPath(state, path, e.target.value);
    if(path.startsWith("business.")) persistBusiness();
    if(/^modal\.draft\.items\.\d+\.price$/.test(path)) updateOrderTotalsInline();
    if(path === "modal.draft.name"){
      const btn = document.getElementById("modalSaveBtn");
      if(btn) btn.disabled = !e.target.value.trim();
    }
    return;
  }
  if(e.target.matches('[data-action="input-new-category"]')){ state.newCategoryName = e.target.value; return; }
  if(e.target.matches('[data-action="search-clients"]')){
    state.clientSearch = e.target.value;
    const grid = document.getElementById("clientsGrid");
    if(grid){
      const q = state.clientSearch.toLowerCase();
      const filtered = state.clients.filter(c => c.name.toLowerCase().includes(q) || (c.phone||"").includes(q));
      grid.innerHTML = clientCardsHtml(filtered);
    }
    return;
  }
});
function updateOrderTotalsInline(){
  if(!state.modal || state.modal.type!=="order") return;
  const o = state.modal.draft, business = state.business;
  const total = orderTotal(o), paid = orderPaid(o), bal = total-paid;
  const tEl=document.getElementById("ordTotalVal"), pEl=document.getElementById("ordPaidVal"), bEl=document.getElementById("ordBalanceVal");
  if(tEl) tEl.textContent = money(total, business.currency);
  if(pEl) pEl.textContent = money(paid, business.currency);
  if(bEl){ bEl.textContent = money(bal, business.currency); bEl.style.color = bal>0 ? "var(--rust)" : "var(--green)"; }
}

document.addEventListener("change", (e) => {
  if(e.target.matches('[data-action="toggle-auto-backup"]')){
    if(state.viewOnly){ showViewOnlyToast(); e.target.checked = state.backupSettings.enabled; return; }
    state.backupSettings.enabled = e.target.checked;
    // Start the interval fresh from now rather than immediately firing a
    // backup the moment it's turned on.
    state.backupSettings.lastBackupAt = new Date().toISOString();
    persistBackupSettings();
    render();
    return;
  }
  const bindEl = e.target.closest("[data-bind]");
  if(bindEl && bindEl.hasAttribute("data-rerender")){
    const path = bindEl.getAttribute("data-bind");
    if(state.viewOnly && !path.startsWith("authForm.")){ showViewOnlyToast(); render(); return; }
    setPath(state, path, e.target.value);
    if(path.startsWith("backupSettings.")) persistBackupSettings();
    render();
    return;
  }
  if(state.viewOnly && e.target.matches('[data-action]') && MUTATING_CHANGE_ACTIONS.has(e.target.getAttribute("data-action"))){
    showViewOnlyToast();
    e.target.value = "";
    return;
  }
  if(e.target.matches('[data-action="import-data-file"]')){
    const f = e.target.files && e.target.files[0];
    if(f) importBackup(f);
    e.target.value = "";
    return;
  }
  if(e.target.matches('[data-action="upload-logo"]')){
    const f = e.target.files && e.target.files[0];
    if(f){ resizeImage(f, 300, 0.82).then(url => { state.business.logo = url; persistBusiness(); render(); }); }
    return;
  }
  if(e.target.matches('[data-action="upload-images"]')){
    const target = e.target.getAttribute("data-target");
    const files = Array.from(e.target.files||[]);
    Promise.all(files.map(f=>resizeImage(f))).then(urls=>{
      const arr = getPath(state, target);
      urls.forEach(u=>arr.push(u));
      render();
    });
    return;
  }
  if(e.target.matches('[data-action="upload-gallery-images"]')){
    const catId = e.target.getAttribute("data-cat");
    const files = Array.from(e.target.files||[]);
    Promise.all(files.map(f=>resizeImage(f, 640, 0.75))).then(urls=>{
      const cat = state.catalogue.categories.find(c=>c.id===catId);
      if(cat){ urls.forEach(u=>cat.gallery.push(u)); persistCatalogue(); }
      render();
    });
    return;
  }
});

/* ================= PULL TO REFRESH ================= */
function ensurePullIndicator(){
  let el = document.getElementById("pullRefreshIndicator");
  if(!el){
    el = document.createElement("div");
    el.id = "pullRefreshIndicator";
    el.style.cssText = "position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;height:56px;transform:translateY(-56px);z-index:9998;pointer-events:none;";
    el.innerHTML = '<div style="width:34px;height:34px;border-radius:50%;background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;color:var(--primary);">'+
      '<span id="pullArrow" style="display:flex;transition:transform .1s;">'+icon("refresh",16)+'</span></div>';
    document.body.appendChild(el);
  }
  return el;
}
function initPullToRefresh(){
  const THRESHOLD = 70, MAX_PULL = 110;
  let startY = 0, pulling = false, dragged = 0, refreshing = false;

  function contentEl(){ return document.getElementById("content"); }
  function blocked(){ return refreshing || state.modal || state.lightbox || state.tour; }

  document.addEventListener("touchstart", (e) => {
    if(blocked() || e.touches.length!==1){ pulling=false; return; }
    const sc = contentEl();
    const atTop = !sc || sc.scrollTop <= 0;
    pulling = atTop;
    startY = e.touches[0].clientY;
    dragged = 0;
  }, {passive:true});

  document.addEventListener("touchmove", (e) => {
    if(!pulling || blocked()) return;
    const sc = contentEl();
    const atTop = !sc || sc.scrollTop <= 0;
    const dy = e.touches[0].clientY - startY;
    if(dy > 0 && atTop){
      dragged = Math.min(dy*0.5, MAX_PULL);
      const el = ensurePullIndicator();
      el.style.transition = "none";
      el.style.transform = "translateY("+(dragged-56)+"px)";
      const arrow = document.getElementById("pullArrow");
      if(arrow) arrow.style.transform = "rotate("+Math.min(dragged/THRESHOLD,1)*220+"deg)";
    } else {
      pulling = false;
    }
  }, {passive:true});

  document.addEventListener("touchend", () => {
    if(!pulling) return;
    pulling = false;
    const el = ensurePullIndicator();
    el.style.transition = "transform .2s";
    if(dragged >= THRESHOLD){
      refreshing = true;
      el.style.transform = "translateY(8px)";
      const arrow = document.getElementById("pullArrow");
      if(arrow) arrow.style.animation = "spin .6s linear infinite";
      setTimeout(() => { window.location.reload(); }, 200);
    } else {
      el.style.transform = "translateY(-56px)";
    }
    dragged = 0;
  }, {passive:true});
}
initPullToRefresh();

loadAll();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('Service worker registered successfully.', reg);
          // Check for a newer sw.js every time the app is opened.
          reg.update().catch(() => {});
          // If a new worker is already waiting, activate it now.
          if (reg.waiting) reg.waiting.postMessage('skipWaiting');
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller){
                nw.postMessage('skipWaiting');
              }
            });
          });
        })
        .catch((err) => console.log('Service worker registration failed:', err));

      // Once the new service worker takes control, reload once so the
      // page itself (not just cached assets) is the latest version.
      let refreshed = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshed) return;
        refreshed = true;
        window.location.reload();
      });
    });
  }
</script>
